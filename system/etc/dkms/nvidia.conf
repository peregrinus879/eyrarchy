# EyrArcHy DKMS override for the nvidia module (DEVIATIONS.md, Host), read
# after the package's dkms.conf (dkms(8), DKMS.CONF OVERRIDES). Every build
# runs /etc/dkms/nvidia/nvidia-difr-patch on DKMS's fresh copy of the source.
# PRE_BUILD rather than PATCH[], because DKMS halts the build when a PATCH[]
# entry does not apply.
PRE_BUILD="nvidia-difr-patch $dkms_tree/$PACKAGE_NAME/$PACKAGE_VERSION/build $kernelver"
